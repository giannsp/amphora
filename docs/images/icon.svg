<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E5C99"/><stop offset="1" stop-color="#11274A"/></linearGradient>
  <radialGradient id="bgLight" cx="0.5" cy="0.18" r="0.8"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <!-- glazed clay: lit from above, deepening toward the foot -->
  <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7A266"/><stop offset="0.45" stop-color="#E5713A"/><stop offset="1" stop-color="#B9461C"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7A2A0C" stop-opacity="0.28"/><stop offset="0.22" stop-color="#7A2A0C" stop-opacity="0"/>
    <stop offset="0.78" stop-color="#7A2A0C" stop-opacity="0"/><stop offset="1" stop-color="#7A2A0C" stop-opacity="0.38"/></linearGradient>
  <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F29457"/><stop offset="1" stop-color="#C9572A"/></linearGradient>
  <filter id="cast" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/></filter>
  <clipPath id="vc"><path d="M420 222 H604 Q620 222 620 236 Q620 250 604 252 C584 256 576 266 575 288 C574 318 586 340 616 358 C690 400 732 456 732 532 C732 628 666 704 600 748 C584 760 576 772 576 786 V796 C612 802 632 814 632 830 H392 C392 814 412 802 448 796 V786 C448 772 440 760 424 748 C358 704 292 628 292 532 C292 456 334 400 408 358 C438 340 450 318 449 288 C448 266 440 256 420 252 Q404 250 404 236 Q404 222 420 222 Z"/></clipPath>
</defs>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tileShadow)"/>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bgLight)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
<g transform="translate(512 526) scale(0.84) translate(-512 -526)">
  <g filter="url(#cast)">
    <path d="M452 280 C352 262 286 300 318 412" fill="none" stroke="url(#handle)" stroke-width="38" stroke-linecap="round"/>
    <path d="M572 280 C672 262 738 300 706 412" fill="none" stroke="url(#handle)" stroke-width="38" stroke-linecap="round"/>
    <path d="M420 222 H604 Q620 222 620 236 Q620 250 604 252 C584 256 576 266 575 288 C574 318 586 340 616 358 C690 400 732 456 732 532 C732 628 666 704 600 748 C584 760 576 772 576 786 V796 C612 802 632 814 632 830 H392 C392 814 412 802 448 796 V786 C448 772 440 760 424 748 C358 704 292 628 292 532 C292 456 334 400 408 358 C438 340 450 318 449 288 C448 266 440 256 420 252 Q404 250 404 236 Q404 222 420 222 Z" fill="url(#clay)"/>
  </g>
  <g clip-path="url(#vc)">
    <rect x="280" y="200" width="464" height="660" fill="url(#side)"/>
    <!-- one glaze band: the pottery cue, nothing more -->
    <rect x="280" y="560" width="464" height="34" fill="#22160F" opacity="0.88"/>
    <!-- specular sheen on the shoulder -->
    <ellipse cx="430" cy="455" rx="70" ry="120" fill="url(#sheen)" transform="rotate(-18 430 455)"/>
  </g>
  <!-- light catching the lip: the bright top edge -->
  <path d="M424 226 H600" stroke="#FFE2C8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</g>
</svg>