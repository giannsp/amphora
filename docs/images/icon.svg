<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244878"/>
      <stop offset="1" stop-color="#0E1D38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#4E7FB8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4E7FB8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9955C"/>
      <stop offset="0.45" stop-color="#D5743F"/>
      <stop offset="1" stop-color="#A24C26"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="vase" d="M437 210 H587 Q599 210 599 222 V232 Q599 246 585 246 H574
      C574 292 576 318 592 338 C652 372 704 420 710 500 C716 600 652 690 592 745
      C574 762 568 772 568 786 L568 798 C602 804 616 812 616 828 L408 828
      C408 812 422 804 456 798 L456 786 C456 772 450 762 432 745
      C372 690 308 600 314 500 C320 420 372 372 432 338 C448 318 450 292 450 246
      H439 Q425 246 425 232 V222 Q425 210 437 210 Z"/>
    <clipPath id="vaseClip"><use href="#vase"/></clipPath>
    <pattern id="meander" width="36" height="24" patternUnits="userSpaceOnUse" x="8" y="376">
      <path d="M3 21 V3 H27 V15 H13 V10" fill="none" stroke="#1A1410" stroke-width="4" stroke-linecap="square"/>
    </pattern>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="836" rx="150" ry="16" fill="#000" opacity="0.45" filter="url(#soft)"/>

  <!-- handles (black glaze) -->
  <path d="M452 262 C380 254 352 292 372 364" fill="none" stroke="#1A1410" stroke-width="24" stroke-linecap="round"/>
  <path d="M572 262 C644 254 672 292 652 364" fill="none" stroke="#1A1410" stroke-width="24" stroke-linecap="round"/>

  <!-- body -->
  <use href="#vase" fill="url(#clay)"/>
  <g clip-path="url(#vaseClip)">
    <!-- black glaze: rim and neck -->
    <rect x="300" y="200" width="424" height="138" fill="#1A1410"/>
    <!-- clay line separating neck from shoulder -->
    <rect x="300" y="352" width="424" height="6" fill="#1A1410"/>
    <!-- meander band -->
    <rect x="300" y="374" width="424" height="28" fill="url(#meander)"/>
    <rect x="300" y="408" width="424" height="5" fill="#1A1410"/>
    <!-- lower body and foot glazed -->
    <rect x="300" y="684" width="424" height="160" fill="#1A1410"/>
    <rect x="300" y="672" width="424" height="5" fill="#1A1410"/>
    <!-- gloss -->
    <ellipse cx="402" cy="520" rx="58" ry="150" fill="url(#gloss)"/>
  </g>

  <!-- the painted figure: an iPhone in black-figure, details incised to the clay -->
  <g>
    <rect x="462" y="440" width="100" height="196" rx="22" fill="#1A1410"/>
    <rect x="471" y="449" width="82" height="178" rx="15" fill="none" stroke="#D5743F" stroke-width="3.5"/>
    <rect x="497" y="459" width="30" height="9" rx="4.5" fill="#D5743F"/>
    <!-- restore arrow incised on the screen -->
    <path d="M494 528 A22 22 0 1 0 512 506" fill="none" stroke="#E08A52" stroke-width="6" stroke-linecap="round"/>
    <path d="M512 495 L500 506 L512 517" fill="none" stroke="#E08A52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
